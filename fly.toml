# fly.toml app configuration file generated for happyblog on 2026-11-25T08:02:15Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'happyblog'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8888'

[processes]
  app = "/bin/sh -c 'cd /data && exec /app/happyblog'"

[[mounts]]
  source = 'happyblog_data'
  destination = '/data'

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
