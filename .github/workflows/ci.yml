name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web (Vite + Vue)
        run: cd web && npm install && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Prepare config
        run: cp configs/webconfig.yaml.template configs/webconfig.yaml
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
