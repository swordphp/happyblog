# HappyBlog —— SQLite 单文件一键启动(默认,最简单)
#   docker compose up -d   然后浏览器打开 http://localhost:8888 完成安装向导
#
# 所有数据(SQLite 库、配置、上传图片、日志)都落在 /app/data,由下方命名卷持久化。
# 想用 MySQL/MariaDB 见 docker-compose.mysql.yml。

services:
  app:
    # 已发布镜像(由 .github/workflows/docker.yml 推送到 GHCR)
    image: ghcr.io/swordphp/happyblog:latest
    # 如需本地源码构建,注释掉上面的 image,改用:
    # build: .
    working_dir: /app/data        # 库/配置/上传/日志统一落在此目录,便于持久化
    ports:
      - "8888:8888"
    volumes:
      - happyblog_data:/app/data
    restart: unless-stopped

volumes:
  happyblog_data:
