version: "3.8"

services:
  db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: happyblog
      MYSQL_DATABASE: happyblog
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # 首次启动自动导入建表语句
      - ./createTable.sql:/docker-entrypoint-initdb.d/createTable.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      # 挂载本地配置,方便修改(需先从 template 复制一份 webconfig.yaml)
      - ./configs:/app/configs
      - ./log:/app/log

volumes:
  dbdata:
